<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket details - BugTracker</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <a href="tickets.html" class="text-decoration-none small fw-semibold d-inline-block mb-3">
        <i class="bi bi-arrow-left me-1"></i> Back to all tickets
      </a>

      <div id="not-found" class="card-soft empty-state d-none">
        <i class="bi bi-emoji-frown"></i>
        <h5>Ticket not found</h5>
        <p class="mb-3" id="not-found-msg">This ticket does not exist (maybe it was deleted).</p>
        <a href="tickets.html" class="btn btn-primary">Go to all tickets</a>
      </div>

      <div class="row g-3" id="ticket-view" style="visibility:hidden">
        <!-- left: description + comments -->
        <div class="col-xl-8">
          <div class="card-soft card-body-pad mb-3">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
              <span class="ticket-code fs-6" id="d-code"></span>
              <span id="d-status"></span>
              <span id="d-priority"></span>
              <span id="d-severity"></span>
            </div>
            <h3 class="detail-title mb-3" id="d-title"></h3>
            <div class="text-muted small fw-semibold text-uppercase mb-2" style="letter-spacing:.06em">Description</div>
            <div class="description-box" id="d-description"></div>
          </div>

          <div class="card-soft">
            <div class="card-head"><h5>Comments <span class="text-muted fw-normal" id="comment-count"></span></h5></div>
            <div class="card-body-pad">
              <div id="comment-list"></div>

              <form id="comment-form" class="mt-3" novalidate>
                <label class="form-label" for="comment-text">Add a comment</label>
                <textarea class="form-control mb-2" id="comment-text" rows="3" maxlength="2000" placeholder="Write a comment..."></textarea>
                <div class="d-flex justify-content-end">
                  <button type="submit" class="btn btn-primary btn-sm" id="comment-btn"><i class="bi bi-chat-left-text me-1"></i> Post comment</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- right: actions + details -->
        <div class="col-xl-4">
          <div class="card-soft mb-3">
            <div class="card-head"><h5>Manage ticket</h5></div>
            <div class="card-body-pad">
              <label class="form-label" for="status-select">Status</label>
              <div class="input-group mb-1">
                <select class="form-select" id="status-select"></select>
                <button class="btn btn-primary" id="status-btn" type="button">Update</button>
              </div>
              <div class="form-text mb-3" id="status-hint"></div>

              <div id="assign-block">
                <label class="form-label" for="assign-select">Assign to developer</label>
                <div class="input-group mb-3">
                  <select class="form-select" id="assign-select"></select>
                  <button class="btn btn-primary" id="assign-btn" type="button">Assign</button>
                </div>
              </div>

              <div class="d-flex gap-2" id="action-buttons">
                <button class="btn btn-outline-primary flex-fill d-none" id="edit-btn" type="button"><i class="bi bi-pencil me-1"></i> Edit</button>
                <button class="btn btn-outline-danger flex-fill d-none" id="delete-btn" type="button"><i class="bi bi-trash3 me-1"></i> Delete</button>
              </div>
            </div>
          </div>

          <div class="card-soft">
            <div class="card-head"><h5>Details</h5></div>
            <div class="card-body-pad py-2">
              <div class="meta-row"><span class="k">Reporter</span><span class="v" id="m-reporter"></span></div>
              <div class="meta-row"><span class="k">Assignee</span><span class="v" id="m-assignee"></span></div>
              <div class="meta-row"><span class="k">Created</span><span class="v" id="m-created"></span></div>
              <div class="meta-row"><span class="k">Last updated</span><span class="v" id="m-updated"></span></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ticket.js"></script>
</body>
</html>
