<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - BugTracker</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header">
        <div>
          <h2 id="welcome">Welcome back</h2>
          <p>Here is what is happening with your tickets today.</p>
        </div>
        <a href="report.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Report a Bug</a>
      </div>

      <!-- the four main numbers -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-xl-3">
          <div class="card-soft stat-card">
            <div class="stat-icon purple"><i class="bi bi-collection-fill"></i></div>
            <div><div class="stat-value" id="stat-total">-</div><div class="stat-label">Total Bugs</div></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card-soft stat-card">
            <div class="stat-icon blue"><i class="bi bi-exclamation-circle-fill"></i></div>
            <div><div class="stat-value" id="stat-open">-</div><div class="stat-label">Open Bugs</div></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card-soft stat-card">
            <div class="stat-icon amber"><i class="bi bi-arrow-repeat"></i></div>
            <div><div class="stat-value" id="stat-progress">-</div><div class="stat-label">In Progress</div></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card-soft stat-card">
            <div class="stat-icon green"><i class="bi bi-check-circle-fill"></i></div>
            <div><div class="stat-value" id="stat-resolved">-</div><div class="stat-label">Resolved Bugs</div></div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <!-- recent tickets -->
        <div class="col-xl-8">
          <div class="card-soft h-100">
            <div class="card-head">
              <h5>Recent tickets</h5>
              <a href="tickets.html" class="btn btn-light-soft btn-sm">View all <i class="bi bi-arrow-right ms-1"></i></a>
            </div>
            <div class="table-responsive">
              <table class="table table-modern">
                <thead>
                  <tr><th>ID</th><th>Title</th><th>Priority</th><th>Status</th><th>Assignee</th></tr>
                </thead>
                <tbody id="recent-body">
                  <tr><td colspan="5" class="empty-state">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- status donut -->
        <div class="col-xl-4">
          <div class="card-soft h-100">
            <div class="card-head"><h5>Status overview</h5></div>
            <div class="card-body-pad">
              <div class="donut-wrap">
                <div class="donut" id="donut">
                  <div class="donut-center"><span class="num" id="donut-total">0</span><span class="lbl">Tickets</span></div>
                </div>
                <div id="donut-legend"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- priority bars -->
        <div class="col-lg-6">
          <div class="card-soft h-100">
            <div class="card-head"><h5>Tickets by priority</h5></div>
            <div class="card-body-pad" id="priority-bars"></div>
          </div>
        </div>

        <!-- developer workload -->
        <div class="col-lg-6">
          <div class="card-soft h-100">
            <div class="card-head"><h5>Developer workload</h5></div>
            <div class="card-body-pad" id="developer-bars"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
