<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports - BugTracker</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header">
        <div>
          <h2>Reports &amp; Statistics</h2>
          <p>A summary of all bugs in the system.</p>
        </div>
        <button class="btn btn-primary" id="export-btn"><i class="bi bi-download me-1"></i> Export CSV</button>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6 col-xl-3">
          <div class="card-soft stat-card">
            <div class="stat-icon purple"><i class="bi bi-collection-fill"></i></div>
            <div><div class="stat-value" id="r-total">-</div><div class="stat-label">Total tickets</div></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card-soft stat-card">
            <div class="stat-icon green"><i class="bi bi-graph-up-arrow"></i></div>
            <div><div class="stat-value" id="r-rate">-</div><div class="stat-label">Resolution rate</div></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card-soft stat-card">
            <div class="stat-icon amber"><i class="bi bi-person-dash-fill"></i></div>
            <div><div class="stat-value" id="r-unassigned">-</div><div class="stat-label">Unassigned</div></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card-soft stat-card">
            <div class="stat-icon gray"><i class="bi bi-lock-fill"></i></div>
            <div><div class="stat-value" id="r-closed">-</div><div class="stat-label">Closed</div></div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card-soft h-100">
            <div class="card-head"><h5>Tickets by status</h5></div>
            <div class="card-body-pad" id="r-status"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card-soft h-100">
            <div class="card-head"><h5>Tickets by priority</h5></div>
            <div class="card-body-pad" id="r-priority"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card-soft h-100">
            <div class="card-head"><h5>Tickets by severity</h5></div>
            <div class="card-body-pad" id="r-severity"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card-soft h-100">
            <div class="card-head"><h5>Tickets assigned per developer</h5></div>
            <div class="card-body-pad" id="r-developer"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
