<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Tickets - BugTracker</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header">
        <div>
          <h2>All Tickets</h2>
          <p>Search, filter and manage every bug ticket.</p>
        </div>
        <a href="report.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Report a Bug</a>
      </div>

      <!-- search + filters -->
      <div class="card-soft filter-bar">
        <div class="row g-2 align-items-end">
          <div class="col-lg-3 col-md-6">
            <label class="form-label small mb-1">Search</label>
            <div class="input-icon">
              <i class="bi bi-search"></i>
              <input class="form-control" id="f-search" placeholder="ID, title, description...">
            </div>
          </div>
          <div class="col-lg-2 col-md-3 col-6">
            <label class="form-label small mb-1">Status</label>
            <select class="form-select" id="f-status"><option value="">All statuses</option></select>
          </div>
          <div class="col-lg-2 col-md-3 col-6">
            <label class="form-label small mb-1">Priority</label>
            <select class="form-select" id="f-priority"><option value="">All priorities</option></select>
          </div>
          <div class="col-lg-2 col-md-3 col-6">
            <label class="form-label small mb-1">Severity</label>
            <select class="form-select" id="f-severity"><option value="">All severities</option></select>
          </div>
          <div class="col-lg-2 col-md-3 col-6">
            <label class="form-label small mb-1">Assignee</label>
            <select class="form-select" id="f-assignee">
              <option value="">Anyone</option>
              <option value="0">Unassigned</option>
            </select>
          </div>
          <div class="col-lg-1 col-12">
            <button class="btn btn-light-soft w-100" id="f-clear" title="Clear all filters"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>
      </div>

      <div class="card-soft">
        <div class="card-head">
          <h5>Tickets <span class="text-muted fw-normal ms-1" id="result-count"></span></h5>
          <button class="btn btn-light-soft btn-sm" id="f-mine"><i class="bi bi-person-check me-1"></i> Assigned to me</button>
        </div>
        <div class="table-responsive">
          <table class="table table-modern">
            <thead>
              <tr>
                <th>ID</th><th>Title</th><th>Priority</th><th>Severity</th><th>Status</th>
                <th>Assignee</th><th>Created</th><th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="tickets-body">
              <tr><td colspan="8" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/tickets.js"></script>
</body>
</html>
